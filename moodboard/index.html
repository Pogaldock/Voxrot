<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Moodboard</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#fff;--fg:#000;--mut:#888;--line:#ddd;--dim:rgba(0,0,0,.55)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#fff;--mut:#777;--line:#2a2a2a;--dim:rgba(0,0,0,.75)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;display:flex;align-items:center;gap:10px}
#title{font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#count{color:var(--mut);font-size:13px}
#more{width:36px;height:36px;font-size:20px;line-height:36px;text-align:center}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 12px 10px}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border:1px solid var(--line);border-radius:16px;font-size:14px;white-space:nowrap;user-select:none;-webkit-user-select:none}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.add{border-style:dashed;color:var(--mut)}
#grid{columns:2;column-gap:4px;padding:0 4px calc(env(safe-area-inset-bottom) + 20px)}
@media (min-width:700px){#grid{columns:4}}
#grid img{width:100%;display:block;margin:0 0 4px;border-radius:4px;break-inside:avoid;background:var(--line);min-height:40px}
.empty{color:var(--mut);padding:40px 24px;text-align:center;font-size:14px}
.layer{position:fixed;inset:0;z-index:10;background:var(--dim);display:flex;flex-direction:column;justify-content:flex-end}
.panel{background:var(--bg);border-radius:14px 14px 0 0;padding:14px 0 calc(env(safe-area-inset-bottom) + 14px)}
.panel .row{padding:0 14px}
#sheetImgs{display:flex;gap:6px;padding:0 14px 12px}
#sheetImgs img{height:140px;max-width:100%;object-fit:contain;border-radius:6px;background:var(--line)}
.label{color:var(--mut);font-size:13px;padding:0 14px 8px;display:flex;justify-content:space-between}
#bar{height:2px;background:var(--fg);margin:12px 14px 0;transform-origin:left}
#bar.run{animation:shrink 1.5s linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#viewer{background:#000;justify-content:center}
#viewer img{max-width:100%;max-height:80vh;object-fit:contain;margin:auto}
#viewer .acts{display:flex;justify-content:space-around;padding:14px 0 calc(env(safe-area-inset-bottom) + 14px);color:#fff}
#viewer .acts button{padding:8px 14px}
#viewer .strip .chip{color:#fff;border-color:#444}
.menu button{display:block;width:100%;text-align:left;padding:14px 18px;font-size:16px}
.menu button.warn{color:#d33}
#dip{position:fixed;inset:0;z-index:15;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#track{position:absolute;inset:0;will-change:transform}
#track.anim{transition:transform .22s ease-out}
.slide{position:absolute;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.slide img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
#dipInfo{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;gap:16px;align-items:center;color:#fff;font-size:14px;background:rgba(0,0,0,.6)}
#dipInfo .grow{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dipScope{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);display:flex;gap:6px}
#dipScope .chip{color:#fff;border-color:#444;background:rgba(0,0,0,.5)}
#dipScope .chip.on{background:#fff;color:#000;border-color:#fff}
#words{padding:0 12px 10px}
#wordIn{width:100%;height:36px;border:1px solid var(--line);border-radius:18px;background:transparent;color:var(--fg);padding:0 14px;font:inherit;outline:none}
#sugg,#bwords{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#sugg:empty,#bwords:empty{display:none}
.chip.sug{border-style:dashed}
.chip.word{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn{height:36px;padding:0 16px;border:1px solid var(--fg);border-radius:18px}
#canvas{position:fixed;left:0;right:0;bottom:0;overflow:hidden;touch-action:none;background:var(--bg)}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world img{position:absolute;display:block;border-radius:3px;background:var(--line)}
#world .lbl{position:absolute;font-size:30px;color:var(--fg);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:16px;font-size:14px;z-index:20}
#install{margin:0 12px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:center}
#install span{flex:1;color:var(--mut)}
#install button{border:1px solid var(--fg);border-radius:14px;padding:4px 12px}
</style>
</head>
<body>

<header>
  <div id="title">Moodboard</div>
  <div id="count"></div>
  <button id="viewBtn" style="font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:14px">Canvas</button>
  <button id="similarBtn" style="font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:14px">Similar</button>
  <button id="shuffleBtn" style="font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:14px">Shuffle</button>
  <button id="more" aria-label="Board options">&#8943;</button>
</header>
<div id="install" hidden><span>Install it so it shows up in the share menu.</span><button id="installBtn" hidden>Install</button></div>
<div id="link" hidden style="color:var(--mut);font-size:12px;padding:0 12px 8px"></div>
<nav class="strip" id="strip"></nav>
<div id="words">
  <input id="wordIn" placeholder="Add a word to this board" autocomplete="off" autocapitalize="off" enterkeyhint="done">
  <div id="sugg"></div>
  <div id="bwords"></div>
</div>
<div id="canvas" hidden><div id="world"></div></div>
<main id="grid"></main>
<div class="empty" id="empty" hidden>Empty board.<br><br>Firefox: double tap images on Google Images.<br>Chrome: open an image, long-press it, <b>Share image</b>, <b>Moodboard</b>.</div>

<!-- Save sheet (opens after a share) -->
<div class="layer" id="sheet" hidden>
  <div class="panel" id="sheetPanel">
    <div id="sheetImgs"></div>
    <div class="label"><span id="sheetMsg">Saved to</span><button id="discard">Discard</button></div>
    <div class="strip" id="sheetStrip"></div>
    <div class="label" style="padding-top:2px;padding-bottom:0">Tap: this image only. Hold: switch session.</div>
    <div id="bar"></div>
  </div>
</div>

<!-- Full image viewer -->
<div class="layer" id="viewer" hidden>
  <img id="viewImg" alt="">
  <div class="strip" id="moveStrip" hidden></div>
  <div class="acts">
    <button id="vSimilar">Similar</button>
    <button id="vSource">Source</button>
    <button id="vMove">Move</button>
    <button id="vDelete">Delete</button>
    <button id="vClose">Close</button>
  </div>
</div>

<!-- Board menu -->
<div class="layer" id="menu" hidden>
  <div class="panel menu">
    <button data-a="new">New board</button>
    <button data-a="rename">Rename board</button>
    <button data-a="export">Export board as zip</button>
    <button data-a="debug" id="debugBtn" hidden>Copy Google debug log</button>
    <button data-a="delete" class="warn">Delete board</button>
  </div>
</div>

<!-- Shuffle viewer: random images full screen, swipe left/right, swipe down or back to close -->
<div id="dip" hidden>
  <div id="track"><div class="slide" style="left:-100%"><img alt=""></div><div class="slide" style="left:0"><img alt=""></div><div class="slide" style="left:100%"><img alt=""></div></div>
  <div id="dipScope" hidden><button class="chip" data-s="all">All boards</button><button class="chip" data-s="board">This board</button></div>
  <div id="dipInfo" hidden><span class="grow" id="dipBoard"></span><button id="dipSimilar" style="color:#fff">Similar</button><button id="dipSource" style="color:#fff">Source</button><button id="dipDelete" style="color:#fff">Delete</button><button id="dipClose" style="color:#fff">Close</button></div>
</div>

<div id="toast" hidden></div>

<script>
// Only Chrome gets the app manifest (needed for its share menu).
// In Firefox, no manifest means "Add to Home screen" makes a plain shortcut that opens in a normal tab,
// where the Violentmonkey double-tap script runs. An installed Firefox app window doesn't run it.
if (!/Firefox/.test(navigator.userAgent)) {
  var ml = document.createElement('link'); ml.rel = 'manifest'; ml.href = 'manifest.json'; document.head.appendChild(ml);
}
</script>
<script src="db.js"></script>
<script>
var $ = function (s) { return document.querySelector(s); };
var objUrls = [];
var current = null;      // board being viewed (= active board)
var viewing = null;      // item open in viewer

function src(it) {
  if (it.blob) { var u = URL.createObjectURL(it.blob); objUrls.push(u); return u; }
  return it.url;
}
function freeUrls() { objUrls.forEach(URL.revokeObjectURL); objUrls = []; }
// Small preview for grids and the canvas; full image only in the viewers.
function thumbSrc(it) {
  var b = it.thumb || it.blob;
  if (b) { var u = URL.createObjectURL(b); objUrls.push(u); return u; }
  return it.url;
}
function img(it) {
  var i = document.createElement('img');
  i.src = thumbSrc(it); i.loading = 'lazy'; i.referrerPolicy = 'no-referrer'; i.alt = '';
  return i;
}
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 1600);
}
function byCreated(list) { return list.slice().sort(function (a, b) { return (a.c || a.t) - (b.c || b.t); }); }

// Chip with tap + long-press
function chip(text, cls, onTap, onHold) {
  var b = document.createElement('button');
  b.className = 'chip ' + (cls || ''); b.textContent = text;
  var timer, held = false;
  b.addEventListener('pointerdown', function () {
    held = false;
    if (onHold) timer = setTimeout(function () { held = true; if (navigator.vibrate) navigator.vibrate(15); onHold(); }, 450);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, function () { clearTimeout(timer); }); });
  b.addEventListener('click', function () { if (!held) onTap(); });
  b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  return b;
}

async function render() {
  freeUrls();
  current = await MB.active();
  var boards = byCreated(await MB.boards());
  var board = boards.find(function (b) { return b.id === current; });
  $('#title').textContent = board ? board.name : 'Moodboard';

  var strip = $('#strip'); strip.innerHTML = '';
  boards.forEach(function (b) {
    strip.appendChild(chip(b.name, b.id === current ? 'on' : '', async function () { await MB.setActive(b.id); render(); }));
  });
  strip.appendChild(chip('+', 'add', newBoard));
  var on = strip.querySelector('.on'); if (on) on.scrollIntoView({ inline: 'nearest', block: 'nearest' });

  var items = await MB.byBoard(current);
  boardItems = items;
  $('#count').textContent = items.length || '';
  var grid = $('#grid'); grid.innerHTML = '';
  items.forEach(function (it) {
    var i = img(it);
    i.onclick = function () { openViewer(it); };
    grid.appendChild(i);
  });
  $('#empty').hidden = items.length > 0 || canvasOn;
  drawWords(board);
  if (canvasOn) drawCanvas(items);
  makeThumbs(items);
  drawCtx();
  hello();
}

async function newBoard() {
  var name = (prompt('Board name') || '').trim();
  if (!name) return null;
  var b = await MB.newBoard(name);
  await MB.setActive(b.id);
  render();
  return b;
}

// ---------- Save sheet ----------
var sheetIds = [], sheetTimer = null, sheetBoard = null;

async function openSheet(ids) {
  sheetIds = ids;
  var items = (await Promise.all(ids.map(function (id) { return MB.get('items', id); }))).filter(Boolean);
  if (!items.length) { finishSheet(); return; }
  sheetBoard = items[0].board;
  var box = $('#sheetImgs'); box.innerHTML = '';
  items.slice(0, 3).forEach(function (it) { box.appendChild(img(it)); });
  $('#sheetMsg').textContent = items.length > 1 ? items.length + ' saved to' : 'Saved to';
  await drawSheetChips();
  $('#sheet').hidden = false;
  var bar = $('#bar'); bar.classList.remove('run'); void bar.offsetWidth; bar.classList.add('run');
  sheetTimer = setTimeout(finishSheet, 1500);
}

async function drawSheetChips() {
  var boards = await MB.boards(); // most recently used first
  var s = $('#sheetStrip'); s.innerHTML = '';
  boards.forEach(function (b) {
    s.appendChild(chip(b.name, b.id === sheetBoard ? 'on' : '',
      async function () { await moveSheet(b.id, false); },
      async function () { await moveSheet(b.id, true); }));
  });
  s.appendChild(chip('+ new', 'add', async function () {
    var name = (prompt('New board') || '').trim();
    if (!name) return;
    var b = await MB.newBoard(name);
    await moveSheet(b.id, true);
  }));
}

async function moveSheet(boardId, makeActive) {
  await MB.move(sheetIds, boardId);
  if (makeActive) await MB.setActive(boardId);
  sheetBoard = boardId;
  await drawSheetChips();
  var b = await MB.get('boards', boardId);
  $('#sheetMsg').textContent = makeActive ? 'Session now: ' + b.name : 'Moved to ' + b.name;
  setTimeout(finishSheet, 700);
}

function finishSheet() {
  clearTimeout(sheetTimer);
  if ($('#sheet').hidden && !sheetIds.length) return;
  $('#sheet').hidden = true; sheetIds = [];
  history.replaceState(null, '', location.pathname);
  try { window.close(); } catch (e) {}
  render();
}

// Any touch on the sheet stops the auto-close so you have time to pick.
$('#sheetPanel').addEventListener('pointerdown', function () {
  clearTimeout(sheetTimer); $('#bar').classList.remove('run'); $('#bar').style.transform = 'scaleX(0)';
});
$('#discard').onclick = async function () {
  for (var i = 0; i < sheetIds.length; i++) await MB.del('items', sheetIds[i]);
  toast('Discarded'); finishSheet();
};

// ---------- Viewer ----------
function openViewer(it) {
  viewing = it;
  $('#viewImg').src = src(it);
  $('#vSource').hidden = !it.src;
  $('#moveStrip').hidden = true;
  $('#viewer').hidden = false;
}
function closeViewer() { $('#viewer').hidden = true; viewing = null; }
$('#vClose').onclick = closeViewer;
$('#viewImg').onclick = closeViewer;
$('#vSource').onclick = function () { if (viewing && viewing.src) window.open(viewing.src, '_blank'); };
$('#vDelete').onclick = async function () {
  await MB.del('items', viewing.id); closeViewer(); toast('Deleted'); render();
};
$('#vMove').onclick = async function () {
  var s = $('#moveStrip'); s.innerHTML = '';
  (await MB.boards()).forEach(function (b) {
    if (b.id === viewing.board) return;
    s.appendChild(chip(b.name, '', async function () {
      await MB.move([viewing.id], b.id); closeViewer(); toast('Moved to ' + b.name); render();
    }));
  });
  s.hidden = !s.children.length;
  if (!s.children.length) toast('No other boards yet');
};

// ---------- Board menu ----------
$('#more').onclick = function () { $('#menu').hidden = false; };
$('#menu').onclick = async function (e) {
  var a = e.target.dataset && e.target.dataset.a;
  $('#menu').hidden = true;
  if (!a) return;
  var board = await MB.get('boards', current);
  if (a === 'new') newBoard();
  if (a === 'rename') {
    var n = (prompt('Rename board', board.name) || '').trim();
    if (n) { board.name = n; await MB.put('boards', board); render(); }
  }
  if (a === 'delete') {
    var items = await MB.byBoard(current);
    if (!confirm('Delete "' + board.name + '" and its ' + items.length + ' images?')) return;
    for (var i = 0; i < items.length; i++) await MB.del('items', items[i].id);
    await MB.del('boards', current);
    await MB.del('meta', 'active');
    render();
  }
  if (a === 'export') exportZip(board);
  if (a === 'debug') bridgeSend({ type: 'debug?' });
};

// ---------- Bridge to the Google double-tap userscript (Firefox + Violentmonkey) ----------
// The userscript keeps a queue of images saved on Google and hands it over here.
var BP = 'mbx:', importing = false, linked = false;
var linkText = '';
function setLink(t) { linkText = t; drawCtx(); }
async function drawCtx() {
  var n = (await MB.all('items')).length;
  var el = $('#link'); el.hidden = false;
  el.textContent = contextLabel() + ' · ' + n + ' images saved here' + (linkText ? ' · ' + linkText : '');
}
// In Firefox the userscript should answer within a moment. If it doesn't, say so.
if (/Firefox/.test(navigator.userAgent)) setTimeout(function () {
  if (!linked) setLink('Google link off: Violentmonkey script not running on this page');
}, 2500);
// Coming back to an already-open Moodboard tab: collect anything saved meanwhile.
document.addEventListener('visibilitychange', function () { if (!document.hidden) hello(); });
addEventListener('pageshow', function () { hello(); });
addEventListener('focus', function () { hello(); });
function bridgeSend(o) { window.postMessage(BP + JSON.stringify(o), '*'); }
async function hello() {
  var boards = await MB.boards();
  bridgeSend({ type: 'hello', state: {
    boards: boards.map(function (b) { return { id: b.id, name: b.name }; }),
    active: await MB.active(),
    activeT: (await MB.get('meta', 'activeT')) || 0
  } });
}
addEventListener('message', async function (e) {
  if (typeof e.data !== 'string' || e.data.indexOf(BP) !== 0) return;
  var m = JSON.parse(e.data.slice(BP.length));
  if (m.type === 'ready') {
    linked = true; $('#debugBtn').hidden = false; $('#install').hidden = true;
    setLink('Google link on' + (m.waiting ? ' · ' + m.waiting + ' waiting' : ''));
    hello();
  }
  if (m.type === 'progress') toast(m.total ? '"' + m.word + '" ' + m.done + '/' + m.total : 'No results for "' + m.word + '"');
  if (m.type === 'debug') {
    try { await navigator.clipboard.writeText(m.text); toast('Debug log copied'); }
    catch (err) { prompt('Copy this', m.text); }
  }
  if (m.type === 'import' && !importing) {
    importing = true;
    try {
      var now = Date.now(), boardIds = [], ids = [];
      for (var i = 0; i < m.boards.length; i++) {
        var b = m.boards[i];
        if (!(await MB.get('boards', b.id))) await MB.put('boards', { id: b.id, name: b.name, t: now, c: now + i });
        boardIds.push(b.id);
      }
      if (m.active && (await MB.get('boards', m.active))) await MB.setActive(m.active, m.activeT);
      var fallback = await MB.active();
      for (var j = 0; j < m.items.length; j++) {
        var q = m.items[j];
        var blob = q.data ? await (await fetch(q.data)).blob() : null;
        var board = (await MB.get('boards', q.board)) ? q.board : fallback;
        await MB.put('items', { id: q.id, board: board, blob: blob || undefined, url: blob ? undefined : q.url, src: q.src, word: q.word || undefined, t: q.t });
        await MB.touch(board);
        ids.push(q.id);
      }
      bridgeSend({ type: 'imported', ids: ids, boardIds: boardIds });
      if (ids.length) toast(ids.length + ' from Google');
      setLink('Google link on');
    } finally { importing = false; }
    render();
  }
});

// ---------- Zip export (no compression, no libraries) ----------
var CRC = (function () {
  var t = new Uint32Array(256);
  for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(d) { var c = 0xFFFFFFFF; for (var i = 0; i < d.length; i++) c = CRC[(c ^ d[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function makeZip(files) {
  var enc = new TextEncoder(), parts = [], central = [], off = 0;
  files.forEach(function (f) {
    var name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    var h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(12, 33, true);
    h.setUint32(14, crc, true); h.setUint32(18, size, true); h.setUint32(22, size, true); h.setUint16(26, name.length, true);
    parts.push(h.buffer, name, f.data);
    var c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(14, 33, true);
    c.setUint32(16, crc, true); c.setUint32(20, size, true); c.setUint32(24, size, true); c.setUint16(28, name.length, true);
    c.setUint32(42, off, true);
    central.push(c.buffer, name);
    off += 30 + name.length + size;
  });
  var cdSize = central.reduce(function (s, p) { return s + (p.byteLength || p.length); }, 0);
  var e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob(parts.concat(central, [e.buffer]), { type: 'application/zip' });
}

async function exportZip(board) {
  var items = (await MB.byBoard(board.id)).reverse(), files = [], links = [];
  for (var i = 0; i < items.length; i++) {
    var it = items[i], num = String(i + 1).padStart(3, '0');
    if (it.blob) {
      var ext = ((it.blob.type || 'image/jpeg').split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace('+xml', '');
      files.push({ name: num + '.' + ext, data: new Uint8Array(await it.blob.arrayBuffer()) });
    } else links.push(num + '  ' + it.url);
    if (it.src) links.push(num + '  source: ' + it.src);
  }
  if (links.length) files.push({ name: 'links.txt', data: new TextEncoder().encode(links.join('\n')) });
  if (!files.length) { toast('Nothing to export'); return; }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(makeZip(files));
  a.download = board.name.replace(/[^\w\- ]+/g, '').trim() + '.zip';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
}

// ---------- Install + service worker ----------
var installEvt = null;
var standalone = matchMedia('(display-mode: standalone)').matches;
if (!standalone && !/Firefox/.test(navigator.userAgent)) $('#install').hidden = false;
if (!standalone) $('#install span').textContent = 'Install it so it shows up in the share menu: Chrome menu, then Add to home screen.';
addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault(); installEvt = e;
  $('#install span').textContent = 'Install it so it shows up in the share menu.';
  $('#installBtn').hidden = false;
});
$('#installBtn').onclick = async function () {
  if (!installEvt) return;
  installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#install').hidden = true;
};
addEventListener('appinstalled', function () { $('#install').hidden = true; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// Close overlays with the Android back gesture is not wired; Close/tap does it.
// ---------- Shuffle viewer ----------
var dip = { list: [], i: 0, urls: {}, scope: 'all', names: {} };
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  return dip.urls[it.id];
}

  var keep = {};
  var imgs = document.querySelectorAll('#track img');
  [-1, 0, 1].forEach(function (k, n) { var it = dipItem(k); keep[it.id] = 1; imgs[n].src = dipUrl(it); });
  dipItem(2) && (keep[dipItem(2).id] = 1, dipUrl(dipItem(2)));
  Object.keys(dip.urls).forEach(function (id) {
    if (!keep[id]) { if (dip.urls[id].indexOf('blob:') === 0) URL.revokeObjectURL(dip.urls[id]); delete dip.urls[id]; }
  });
  var cur = dipItem(0);
  $('#dipBoard').textContent = (dip.names[cur.board] || '') + (cur.word ? ' · ' + cur.word : '') + '  ' + (((dip.i % dip.list.length) + dip.list.length) % dip.list.length + 1) + '/' + dip.list.length;
  $('#dipSource').hidden = !cur.src;
  document.querySelectorAll('#dipScope .chip').forEach(function (c) { c.classList.toggle('on', c.dataset.s === dip.scope); });
}
async function openDip(scope) {
  dip.scope = scope || dip.scope;
  var items = dip.scope === 'board' ? await MB.byBoard(current) : await MB.all('items');
  if (!items.length) { toast(dip.scope === 'board' ? 'This board is empty' : 'No images yet'); if (dip.scope === 'board') return openDip('all'); return; }
  dip.names = {}; (await MB.boards()).forEach(function (b) { dip.names[b.id] = b.name; });
  dip.list = shuffle(items); dip.i = 0;
  if ($('#dip').hidden) { $('#dip').hidden = false; history.pushState({ dip: 1 }, ''); }
  $('#dipInfo').hidden = $('#dipScope').hidden = true;
  dipDraw();
}
async function openDipList(list, start) {
  if (!list.length) return;
  dip.names = {}; (await MB.boards()).forEach(function (b) { dip.names[b.id] = b.name; });
  dip.list = list; dip.i = Math.max(0, start);
  if ($('#dip').hidden) { $('#dip').hidden = false; history.pushState({ dip: 1 }, ''); }

  dipDraw();
}
function closeDip(fromPop) {
  if ($('#dip').hidden) return;
  $('#dip').hidden = true;
  Object.keys(dip.urls).forEach(function (id) { if (dip.urls[id].indexOf('blob:') === 0) URL.revokeObjectURL(dip.urls[id]); });

  if (!fromPop && history.state && history.state.dip) history.back();
}
addEventListener('popstate', function () { closeDip(true); });
$('#shuffleBtn').onclick = function () { openDip('all'); };
$('#dipClose').onclick = function () { closeDip(); };
$('#dipDelete').onclick = async function () {
  var it = dipItem(0);
  await MB.del('items', it.id);
  var u = dip.urls[it.id]; if (u && u.indexOf('blob:') === 0) URL.revokeObjectURL(u); delete dip.urls[it.id];
  dip.list.splice(((dip.i % dip.list.length) + dip.list.length) % dip.list.length, 1);
  toast('Deleted');
  if (!dip.list.length) { closeDip(); render(); return; }
  dipDraw(); render();
};
$('#dipSource').onclick = function () { var it = dipItem(0); if (it.src) window.open(it.src, '_blank'); };
document.querySelectorAll('#dipScope .chip').forEach(function (c) { c.onclick = function () { openDip(c.dataset.s); }; });
addEventListener('keydown', function (e) {
  if ($('#dip').hidden) return;
  if (e.key === 'ArrowRight') dipStep(1); if (e.key === 'ArrowLeft') dipStep(-1); if (e.key === 'Escape') closeDip();
});
function dipStep(dir) {
  var track = $('#track');
  track.classList.add('anim'); track.style.transform = 'translateX(' + (-dir * 100) + '%)';
  setTimeout(function () {
    track.classList.remove('anim'); dip.i += dir; dipDraw(); track.style.transform = '';
  }, 220);
}
(function () {
  var el = $('#dip'), track = $('#track'), x0 = 0, y0 = 0, dx = 0, dy = 0, down = false;
  el.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return;
    down = true; x0 = e.clientX; y0 = e.clientY; dx = dy = 0; track.classList.remove('anim');
  });
  el.addEventListener('pointermove', function (e) {
    if (!down) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    if (Math.abs(dx) > Math.abs(dy)) track.style.transform = 'translateX(' + dx + 'px)';
    else if (dy > 0) track.style.transform = 'translateY(' + dy + 'px)';
  });
  function up() {
    if (!down) return; down = false;
    var w = el.clientWidth;
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) {          // tap: show/hide info
      var show = $('#dipInfo').hidden; $('#dipInfo').hidden = $('#dipScope').hidden = !show; track.style.transform = ''; return;
    }
    if (dy > 120 && Math.abs(dy) > Math.abs(dx)) { track.style.transform = ''; closeDip(); return; }
    if (Math.abs(dx) > Math.min(80, w * 0.2)) {
      var dir = dx < 0 ? 1 : -1;
      track.classList.add('anim'); track.style.transform = 'translateX(' + (-dir * w) + 'px)';
      setTimeout(function () { track.classList.remove('anim'); dip.i += dir; dipDraw(); track.style.transform = ''; }, 220);
    } else { track.classList.add('anim'); track.style.transform = ''; }
  }
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
})();

// ---------- Small previews (made once per image, stored with it) ----------
var thumbing = false;
async function makeThumbs(items) {
  if (thumbing) return; thumbing = true;
  var made = 0;
  try {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.thumb || !it.blob) continue;
      try {
        var bmp = await createImageBitmap(it.blob);
        var k = Math.min(1, 480 / Math.max(bmp.width, bmp.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        it.thumb = await new Promise(function (r) { c.toBlob(r, 'image/jpeg', 0.82); });
        it.w = bmp.width; it.h = bmp.height;
        await MB.put('items', it); made++;
      } catch (e) {}
    }
  } finally { thumbing = false; }
  if (made && canvasOn) render();
}

// ---------- Theme words + live suggestions (Datamuse) ----------
var suggTimer = null, suggCtl = null;
function googleUrl(word) { return (window.__mbGoogle || 'https://www.google.com/search') + '?udm=2&q=' + encodeURIComponent(word); }
// Adding a word fetches its images at once. The Google tab must open inside the tap itself
// (browsers block tabs opened later), so grab() runs before anything async.
async function addWord(w) {
  w = w.trim().toLowerCase(); if (!w) return;
  grab(w);
  var b = await MB.get('boards', current);
  b.words = b.words || [];
  if (b.words.indexOf(w) < 0) { b.words.push(w); await MB.put('boards', b); }
  $('#wordIn').value = ''; $('#sugg').innerHTML = '';
  render();
}
function drawWords(board) {
  var box = $('#bwords'); box.innerHTML = '';
  ((board && board.words) || []).forEach(function (w) {
    box.appendChild(chip(w, 'word', function () { grab(w); }, async function () {
      if (!confirm('Remove "' + w + '" from this board? Its images stay.')) return;
      var b = await MB.get('boards', current); b.words = (b.words || []).filter(function (x) { return x !== w; });
      await MB.put('boards', b); render();
    }));
  });
  suggest();
}
async function suggest() {
  clearTimeout(suggTimer);
  suggTimer = setTimeout(async function () {
    var typed = $('#wordIn').value.trim();
    var b = await MB.get('boards', current);
    var have = (b && b.words) || [];
    var basis = typed || have.slice(-3).join(' ');
    var box = $('#sugg');
    if (!basis) { box.innerHTML = ''; return; }
    if (suggCtl) suggCtl.abort();
    suggCtl = new AbortController();
    try {
      var r = await fetch('https://api.datamuse.com/words?max=24&ml=' + encodeURIComponent(basis), { signal: suggCtl.signal });
      var list = (await r.json()).map(function (x) { return x.word; })
        .filter(function (w) { return have.indexOf(w) < 0 && w !== typed.toLowerCase(); }).slice(0, typed ? 12 : 10);
      box.innerHTML = '';
      if (typed) box.appendChild(chip('+ ' + typed, 'sug', function () { addWord(typed); }));
      list.forEach(function (w) { box.appendChild(chip(w, 'sug', function () { addWord(w); })); });
    } catch (e) { if (e.name !== 'AbortError') box.innerHTML = ''; }
  }, 180);
}
$('#wordIn').addEventListener('input', suggest);
$('#wordIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') addWord(this.value); });

// ---------- Find similar: send one image to Google Lens, land on its "Visual matches" feed ----------
// The upload is a normal form POST opened in a new tab, so it has to happen inside the tap (no awaits before submit).
// In Firefox the userscript switches the Lens page to Visual matches and makes double tap save there too.
var boardItems = [];
function lensSearch(it) {
  if (!it) { toast('No images on this board yet'); return; }
  if (linked) bridgeSend({ type: 'lens', board: current });
  var blob = it.blob && it.blob.size < 8e6 ? it.blob : (it.thumb || it.blob);
  if (!blob) {
    if (it.url) window.open('https://lens.google.com/uploadbyurl?url=' + encodeURIComponent(it.url), '_blank');
    else toast('This image has no file to search with');
    return;
  }
  var f = document.createElement('form');
  f.method = 'POST'; f.enctype = 'multipart/form-data'; f.target = '_blank'; f.hidden = true;
  f.action = (window.__mbLens || 'https://lens.google.com/v3/upload') + '?ep=ccm&s=&st=' + Date.now();
  var inp = document.createElement('input'); inp.type = 'file'; inp.name = 'encoded_image';
  var dt = new DataTransfer();
  dt.items.add(new File([blob], 'image.jpg', { type: blob.type || 'image/jpeg' }));
  inp.files = dt.files;
  f.appendChild(inp); document.body.appendChild(f); f.submit(); f.remove();
  toast(linked ? 'Similar images: double tap to save' : 'Opened Google Lens');
}
$('#similarBtn').onclick = function () { lensSearch(boardItems[Math.floor(Math.random() * boardItems.length)]); };
$('#vSimilar').onclick = function () { lensSearch(viewing); };
$('#dipSimilar').onclick = function () { lensSearch(dipItem(0)); };

// Tap a word: open Google Images for it. With the Firefox script running, the results come back here to pick from.
function grab(word) {
  if (linked) bridgeSend({ type: 'grab', word: word, board: current });
  window.open(googleUrl(word), '_blank');
  toast(linked ? 'Getting images for "' + word + '"…' : 'Opened Google. Double tap to save.');
}

// ---------- Canvas: every image of the board, grouped by word; pinch to zoom, drag to pan ----------
var canvasOn = false, cam = { x: 0, y: 0, s: 1 }, camFitted = false, canvasItems = [];
$('#viewBtn').onclick = function () {
  canvasOn = !canvasOn; camFitted = false;
  $('#viewBtn').textContent = canvasOn ? 'Grid' : 'Canvas';
  $('#canvas').hidden = !canvasOn; $('#grid').hidden = canvasOn; $('#words').hidden = canvasOn;
  render();
};
function applyCam() { $('#world').style.transform = 'translate(' + cam.x + 'px,' + cam.y + 'px) scale(' + cam.s + ')'; }
function drawCanvas(items) {
  var cv = $('#canvas');
  cv.style.top = Math.round($('#strip').getBoundingClientRect().bottom + scrollY) + 'px';
  canvasItems = items;
  var groups = {}, order = [];
  items.slice().reverse().forEach(function (it) {
    var w = it.word || 'other';
    if (!groups[w]) { groups[w] = []; order.push(w); }
    groups[w].push(it);
  });
  var COL = 160, GAP = 6, COLS = 3, CW = COLS * COL + (COLS - 1) * GAP, PAD = 90, PER_ROW = 2;
  var world = $('#world'); world.innerHTML = '';
  var x = 0, y = 0, rowH = 0, maxX = 0;
  order.forEach(function (w, gi) {
    if (gi && gi % PER_ROW === 0) { x = 0; y += rowH + PAD; rowH = 0; }
    var lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = w;
    lbl.style.left = x + 'px'; lbl.style.top = y + 'px'; world.appendChild(lbl);
    var colsH = [0, 0, 0], top = y + 46;
    groups[w].forEach(function (it) {
      var c = colsH.indexOf(Math.min.apply(null, colsH));
      var h = it.w && it.h ? COL * it.h / it.w : COL;
      var im = img(it); im.loading = 'eager';
      im.style.left = (x + c * (COL + GAP)) + 'px'; im.style.top = (top + colsH[c]) + 'px';
      im.style.width = COL + 'px'; im.style.height = h + 'px';
      im.dataset.id = it.id; im.dataset.word = w;
      world.appendChild(im);
      colsH[c] += h + GAP;
    });
    rowH = Math.max(rowH, 46 + Math.max.apply(null, colsH));
    x += CW + PAD; maxX = Math.max(maxX, x - PAD);
  });
  if (!camFitted) {
    var vw = cv.clientWidth || innerWidth;
    cam.s = Math.min(1, (vw - 24) / Math.max(1, maxX)); cam.x = 12; cam.y = 12; camFitted = true;
  }
  applyCam();
  if (!items.length) world.innerHTML = '<div class="lbl" style="font-size:18px;color:var(--mut);left:0;top:0">Add words, tap one, pick images.</div>';
}
(function () {
  var cv = $('#canvas'), pts = {}, last = null, moved = 0, downAt = null;
  function mid() { var p = Object.values(pts); return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2, d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) }; }
  function zoomAt(px, py, k) {
    var ns = Math.max(0.05, Math.min(4, cam.s * k)); k = ns / cam.s;
    cam.x = px - (px - cam.x) * k; cam.y = py - (py - cam.y) * k; cam.s = ns; applyCam();
  }
  cv.addEventListener('pointerdown', function (e) {
    cv.setPointerCapture(e.pointerId);
    var r = cv.getBoundingClientRect();
    pts[e.pointerId] = { x: e.clientX - r.left, y: e.clientY - r.top };
    if (Object.keys(pts).length === 1) { moved = 0; downAt = { x: e.clientX, y: e.clientY, t: e.target }; }
    last = Object.keys(pts).length === 2 ? mid() : null;
  });
  cv.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    var r = cv.getBoundingClientRect(), p = pts[e.pointerId];
    var nx = e.clientX - r.left, ny = e.clientY - r.top;
    var n = Object.keys(pts).length;
    if (n === 1) { cam.x += nx - p.x; cam.y += ny - p.y; applyCam(); }
    moved += Math.abs(nx - p.x) + Math.abs(ny - p.y);
    p.x = nx; p.y = ny;
    if (n === 2) {
      var m = mid();
      if (last) { cam.x += m.x - last.x; cam.y += m.y - last.y; zoomAt(m.x, m.y, m.d / Math.max(1, last.d)); }
      last = m;
    }
  });
  function up(e) {
    var wasTap = Object.keys(pts).length === 1 && moved < 10 && downAt;
    delete pts[e.pointerId]; last = Object.keys(pts).length === 2 ? mid() : null;
    if (wasTap && downAt.t.tagName === 'IMG' && downAt.t.dataset.id) {
      var id = downAt.t.dataset.id, w = downAt.t.dataset.word;
      var list = canvasItems.filter(function (it) { return (it.word || 'other') === w; }).reverse();
      openDipList(list, list.findIndex(function (it) { return it.id === id; }));
    }
  }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', function (e) {
    e.preventDefault(); var r = cv.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });
})();

// Where this page is running, so storage mix-ups are visible.
function contextLabel() {
  var app = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches;
  var br = /Firefox/.test(navigator.userAgent) ? 'Firefox' : /SamsungBrowser/.test(navigator.userAgent) ? 'Samsung Internet' : 'Chrome';
  return br + (app ? ' app' : ' tab');
}

(async function start() {
  var q = new URLSearchParams(location.search);
  await render();
  if (q.get('error')) { toast("Couldn't read that share"); history.replaceState(null, '', location.pathname); }
  var saved = (q.get('saved') || '').split(',').filter(Boolean);
  if (saved.length) openSheet(saved);
  else if (q.has('dip')) openDip('all');
})();
